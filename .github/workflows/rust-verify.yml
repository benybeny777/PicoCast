name: Rust 検証

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - rust-toolchain.toml
      - clippy.toml
      - .cargo/**
      - ui/**
      - .github/workflows/rust-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust を固定して導入
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 一括検証
        run: cargo +1.95.0 run --locked -p xtask -- verify
