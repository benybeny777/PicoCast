[workspace]
members = ["crates/picocast-core", "crates/picocast-store", "crates/picocast-ai", "crates/picocast-testkit", "crates/picocast-script", "crates/picocast-voice", "crates/picocast-media", "crates/picocast-pipeline", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[workspace.dependencies]
picocast-core = { path = "crates/picocast-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "net", "sync"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tempfile = "=3.27.0"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
aes-gcm = "0.10"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
jsonschema = { version = "=0.58.6", default-features = false }
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", rev = "90fd6068c80c2fc3b63e0dbab0e341475bad4d8f" }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
unicode-segmentation = "=1.13.3"
budouy = { version = "=0.2.2", default-features = false, features = ["std", "vendored-models"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
sha2 = "=0.11.1"
getrandom = "=0.3.4"
zeroize = "1"
syn = { version = "=2.0.119", features = ["full", "visit"] }
quote = "1"
anyhow = "1"
libc = "0.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
