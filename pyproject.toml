    "google-genai==2.8.0",
    "python-dotenv==1.2.2",
    "Pillow==12.2.0",
    "google-api-python-client==2.197.0",
    "google-auth-oauthlib==1.4.0",
    "openai==2.41.0",
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.30",
    "httpx==0.28.1",
    "sudachipy==0.6.11",
