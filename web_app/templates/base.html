<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ダッシュボード{% endblock %} — {{ web_app_name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{ static_asset_version }}">
</head>
<body>
<nav class="navbar">
  <div class="nav-brand">
    <a href="/">🎬 {{ web_app_name }}</a>
  </div>
  <ul class="nav-links">
    <li><a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>ダッシュボード</a></li>
    <li><a href="/generate" {% if request.url.path == "/generate" %}class="active"{% endif %}>生成</a></li>
    <li><a href="/check" {% if request.url.path == "/check" %}class="active"{% endif %}>チェック</a></li>
    <li><a href="/history" {% if request.url.path.startswith("/history") %}class="active"{% endif %}>履歴</a></li>
    <li><a href="/analytics" {% if request.url.path == "/analytics" %}class="active"{% endif %}>Analytics</a></li>
    <li><a href="/schedule" {% if request.url.path == "/schedule" %}class="active"{% endif %}>スケジュール</a></li>
    <li><a href="/upload" {% if request.url.path == "/upload" %}class="active"{% endif %}>アップロード</a></li>
    <li><a href="/fixed-comment" {% if request.url.path == "/fixed-comment" %}class="active"{% endif %}>固定コメント</a></li>
    <li><a href="/db" {% if request.url.path == "/db" %}class="active"{% endif %}>動画DB</a></li>
    <li class="nav-right"><a href="/logs" {% if request.url.path == "/logs" %}class="active"{% endif %}>ログ</a></li>
    <li><a href="/settings" {% if request.url.path == "/settings" %}class="active"{% endif %}>設定</a></li>
    <li><button class="btn btn-danger btn-xs nav-shutdown-btn" onclick="navShutdown()" title="アプリを終了する">⏻ 終了</button></li>
  </ul>
</nav>

<script>
async function navShutdown() {
  // 実行中ジョブを確認
  let statusData = {};
  try {
    const r = await fetch('/api/shutdown/status');
    statusData = await r.json();
  } catch {}

  const running = statusData.running_jobs || [];
  let force = false;

  if (running.length > 0) {
    const proceed = confirm(
      `動画生成中です（${running.length}件）。\n\n` +
      `「OK」を押すと生成を停止してアプリを終了します。\n` +
      `「キャンセル」を押すと終了を中止します。`
    );
    if (!proceed) return;
    force = true;
  } else {
    if (!confirm('アプリを終了しますか？\n\nWebブラウザのタブはそのまま残ります。')) return;
  }

  try {
    const res = await fetch('/api/shutdown', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({confirmed: true, force}),
    });
    const data = await res.json();
    if (data.ok) {
      document.body.innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;font-family:sans-serif;gap:16px">' +
        '<p style="font-size:1.4rem">⏻ アプリを終了しています...</p>' +
        '<p style="color:#888">このタブは閉じてください。</p></div>';
    } else {
      alert('終了できませんでした: ' + (data.message || JSON.stringify(data)));
    }
  } catch(e) {
    alert('通信エラー: ' + e);
  }
}
</script>

<main class="main-content">
  {% block content %}{% endblock %}
</main>

<script>
window.WEB_JOB_POLL_INTERVAL_MS = {{ web_job_poll_interval_ms }};
window.WEB_SUCCESS_RELOAD_DELAY_MS = {{ web_success_reload_delay_ms }};
window.WEB_TOAST_VISIBLE_MS = {{ web_toast_visible_ms }};
window.WEB_TOAST_HIDE_DELAY_MS = {{ web_toast_hide_delay_ms }};
</script>
<script src="/static/app.js?v={{ static_asset_version }}"></script>
<script src="/static/job_poll.js?v={{ static_asset_version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
