<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ダッシュボード{% endblock %} — {{ web_app_name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{ static_asset_version }}">
</head>
<body>
<div class="sticky-header">
<nav class="navbar">
  <div class="nav-brand">
    <a href="/">🎬 {{ web_app_name }}</a>
  </div>
  <ul class="nav-links">
    <li><a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>ダッシュボード</a></li>
    <li><a href="/generate" {% if request.url.path == "/generate" %}class="active"{% endif %}>生成</a></li>
    <li><a href="/check" {% if request.url.path == "/check" %}class="active"{% endif %}>チェック</a></li>
    <li><a href="/history" {% if request.url.path.startswith("/history") %}class="active"{% endif %}>履歴</a></li>
    <li><a href="/analytics" {% if request.url.path == "/analytics" %}class="active"{% endif %}>Analytics</a></li>
    <li><a href="/schedule" {% if request.url.path == "/schedule" %}class="active"{% endif %}>スケジュール</a></li>
    <li><a href="/upload" {% if request.url.path == "/upload" %}class="active"{% endif %}>アップロード</a></li>
    <li><a href="/playlist-classifier" {% if request.url.path == "/playlist-classifier" %}class="active"{% endif %}>再生リスト振り分け</a></li>
    <li><a href="/fixed-comment" {% if request.url.path == "/fixed-comment" %}class="active"{% endif %}>固定コメント</a></li>
    <li><a href="/db" {% if request.url.path == "/db" %}class="active"{% endif %}>動画DB</a></li>
    <li class="nav-right"><a href="/logs" {% if request.url.path == "/logs" %}class="active"{% endif %}>ログ</a></li>
    <li><a href="/settings" {% if request.url.path == "/settings" %}class="active"{% endif %}>設定</a></li>
    <li><button class="btn btn-danger btn-xs nav-shutdown-btn" onclick="navShutdown()" title="アプリを終了する">⏻ 終了</button></li>
  </ul>
</nav>
<div id="channel-banner" class="channel-banner">
  <span class="ch-label">チャンネル:</span>
  <div class="ch-switcher" id="ch-switcher">
    <button class="ch-switcher-btn" id="ch-switcher-btn" onclick="toggleChMenu(event)" aria-haspopup="true">
      <span id="ch-current-name">読み込み中...</span>
      <span class="ch-switcher-caret">▼</span>
    </button>
    <div class="ch-switcher-menu" id="ch-switcher-menu" role="menu"></div>
  </div>
  <span id="ch-warnings"></span>
</div>
</div>

<script>
// ── チャンネル切替 ───────────────────────────────────────────────
(async function initChannelSwitcher() {
  const btn = document.getElementById('ch-switcher-btn');
  const menu = document.getElementById('ch-switcher-menu');
  const nameEl = document.getElementById('ch-current-name');
  const warningsEl = document.getElementById('ch-warnings');
  const banner = document.getElementById('channel-banner');

  async function loadChannels() {
    try {
      const [curRes, listRes] = await Promise.all([
        fetch('/api/channels/current'),
        fetch('/api/channels'),
      ]);
      const curData = await curRes.json();
      const listData = await listRes.json();
      const current = curData.profile;
      const profiles = listData.profiles || [];

      // アクセントカラー
      if (current && current.channel_accent_color) {
        document.documentElement.style.setProperty('--channel-accent', current.channel_accent_color);
        banner.style.borderLeftColor = current.channel_accent_color;
      }

      // 現在チャンネル表示
      if (current) {
        const handle = current.channel_handle ? ` / ${current.channel_handle}` : '';
        nameEl.textContent = `${current.channel_name}${handle}`;
        nameEl.title = `genre: ${current.genre_profile}`;
      } else {
        nameEl.textContent = '（チャンネル未設定）';
        warningsEl.innerHTML = '<span class="ch-warning ch-error">チャンネルが未設定です。設定画面から追加してください。</span>';
      }

      // メニュー構築
      menu.innerHTML = '';
      for (const p of profiles) {
        const item = document.createElement('div');
        item.className = 'ch-menu-item' + (p.is_active ? ' active' : '');
        item.setAttribute('role', 'menuitem');
        if (p.channel_accent_color) item.style.setProperty('--item-accent', p.channel_accent_color);
        item.innerHTML = `
          <div class="${p.is_active ? 'ch-menu-active-dot' : 'ch-menu-inactive-dot'}"></div>
          <div class="ch-menu-info">
            <div class="ch-menu-name">${escHtml(p.channel_name)}</div>
            <div class="ch-menu-handle">${escHtml(p.channel_handle || '')} — ${escHtml(p.genre_profile)}</div>
          </div>
        `;
        if (!p.is_active) {
          item.onclick = () => switchChannel(p.profile_id);
          item.style.cursor = 'pointer';
        }
        menu.appendChild(item);
      }
      const addLink = document.createElement('a');
      addLink.href = '/settings#channels';
      addLink.className = 'ch-menu-add';
      addLink.textContent = '＋ チャンネルを追加・管理';
      menu.appendChild(addLink);
    } catch (e) {
      nameEl.textContent = '取得失敗';
    }
  }

  async function switchChannel(profileId) {
    menu.classList.remove('open');
    try {
      const res = await fetch(`/api/channels/${encodeURIComponent(profileId)}/activate`, { method: 'POST' });
      if (res.ok) {
        location.reload();
      } else {
        const err = await res.json().catch(() => ({}));
        alert('切替失敗: ' + (err.detail || res.status));
      }
    } catch (e) {
      alert('通信エラー: ' + e);
    }
  }

  window.toggleChMenu = function(e) {
    e.stopPropagation();
    menu.classList.toggle('open');
  };
  document.addEventListener('click', () => menu.classList.remove('open'));

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadChannels();
})();

async function navShutdown() {
  // 実行中ジョブを確認
  let statusData = {};
  try {
    const r = await fetch('/api/shutdown/status');
    statusData = await r.json();
  } catch {}

  const running = statusData.running_jobs || [];
  let force = false;

  if (running.length > 0) {
    const proceed = confirm(
      `動画生成中です（${running.length}件）。\n\n` +
      `「OK」を押すと生成を停止してアプリを終了します。\n` +
      `「キャンセル」を押すと終了を中止します。`
    );
    if (!proceed) return;
    force = true;
  } else {
    if (!confirm('アプリを終了しますか？\n\nWebブラウザのタブはそのまま残ります。')) return;
  }

  try {
    const res = await fetch('/api/shutdown', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({confirmed: true, force}),
    });
    const data = await res.json();
    if (data.ok) {
      document.body.innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;font-family:sans-serif;gap:16px">' +
        '<p style="font-size:1.4rem">⏻ アプリを終了しています...</p>' +
        '<p style="color:#888">このタブは閉じてください。</p></div>';
    } else {
      alert('終了できませんでした: ' + (data.message || JSON.stringify(data)));
    }
  } catch(e) {
    alert('通信エラー: ' + e);
  }
}
</script>
<script>
// ── 裏で動く処理の失敗通知 ───────────────────────────────────────
// OSタスクから実行される固定コメント自動投稿が前回失敗していたら、どの画面でもヘッダーに出す。
// 次に成功した実行で表示は消える（core/background_task_status.py）。
(async function showBackgroundFailures() {
  const warningsEl = document.getElementById('ch-warnings');
  try {
    const res = await fetch('/api/fixed-comment/auto-status');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const run = (await res.json()).last_run;
    if (!run || !run.failed) return;
    const link = document.createElement('a');
    link.href = '/fixed-comment';
    link.className = 'ch-warning ch-error';
    link.textContent = `固定コメントの自動投稿で ${run.failed} 件失敗しています（${run.finished_at}）`;
    warningsEl.appendChild(link);
  } catch (e) {
    console.error('固定コメント自動投稿の前回結果を取得できませんでした', e);
  }
})();
</script>

<main class="main-content">
  {% block content %}{% endblock %}
</main>

<div class="app-version-badge" title="アプリバージョン">v{{ app_version }}</div>

<script>
window.WEB_JOB_POLL_INTERVAL_MS = {{ web_job_poll_interval_ms }};
window.WEB_SUCCESS_RELOAD_DELAY_MS = {{ web_success_reload_delay_ms }};
window.WEB_TOAST_VISIBLE_MS = {{ web_toast_visible_ms }};
window.WEB_TOAST_HIDE_DELAY_MS = {{ web_toast_hide_delay_ms }};
</script>
<script src="/static/app.js?v={{ static_asset_version }}"></script>
<script src="/static/job_poll.js?v={{ static_asset_version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
