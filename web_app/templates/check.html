{% extends "base.html" %}
{% block title %}LLM/尺チェック{% endblock %}
{% block content %}
<h1>LLM/尺チェック</h1>
<p class="hint">台本を貼り付けてチェックします。複数台本は <code>---</code> で区切ってください。</p>

<div class="card">
  <div class="form-group">
    <label for="check-input">台本</label>
    <textarea id="check-input" rows="18" placeholder="動画タイトル: ...&#10;ずんだもん: ..."></textarea>
  </div>
  <div class="action-row">
    <button class="btn btn-primary" onclick="startCheck()">チェック開始</button>
  </div>
</div>

<div id="check-status" class="card mt" style="display:none">
  <h2 id="check-status-title">チェック実行中...</h2>
  <div id="check-log" class="log-box"></div>
</div>

<div id="check-results" class="mt"></div>
{% endblock %}

{% block scripts %}
<script>
async function startCheck() {
  const script = document.getElementById('check-input').value.trim();
  if (!script) { alert('台本を入力してください'); return; }

  document.getElementById('check-status').style.display = 'block';
  document.getElementById('check-results').innerHTML = '';
  const logBox = document.getElementById('check-log');
  logBox.innerHTML = '';
  appendCheckLog('チェックリクエストを送信中...', 'info');

  try {
    const res = await fetch('/api/check', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({script}),
    });
    const data = await res.json();
    if (!res.ok) { appendCheckLog('エラー: ' + (data.detail || ''), 'error'); return; }

    appendCheckLog(`ジョブ登録: ${data.job_id}`, 'info');
    pollCheckJob(data.job_id);
  } catch(e) {
    appendCheckLog('通信エラー: ' + e, 'error');
  }
}

async function pollCheckJob(jobId) {
  const logBox = document.getElementById('check-log');
  createBackoffPoller(async () => {
    try {
      const { allDone, hasFailed } = await updateJobLogs([jobId], logBox, {
        resultLabel: r => r.message || '',
      });
      if (allDone) {
        // 完了ステータスを確認してタイトル更新
        const job = await fetchJobStatus(jobId);
        document.getElementById('check-status-title').textContent =
          `チェック: ${job.status}`;
        if (job.status === 'success' && Array.isArray(job.result)) {
          renderResults(job.result);
        }
        return true;
      }
    } catch(error) { showJobMonitorError(logBox, error); }
    return false;
  }, window.WEB_JOB_POLL_INTERVAL_MS, window.WEB_JOB_POLL_INTERVAL_MS);
}

function renderResults(results) {
  const container = document.getElementById('check-results');
  container.innerHTML = results.map(r => {
    const estSec = r.estimated_seconds ? `${r.estimated_seconds.toFixed(1)}秒` : '—';
    const durationText = r.duration_error
      ? `<span class="badge badge-ng">尺エラー</span> ${esc(r.duration_error)}`
      : `${estSec} <span class="badge">${esc(r.duration_label)}</span>`;
    const scoreBadge = (label, score, status, model, error) => {
      if (error) return `<tr><td>${label}</td><td><span class="badge badge-ng">エラー</span> ${esc(error)}</td></tr>`;
      if (score === null || score === undefined || score === '') return '';
      const cls = score >= 80 ? 'badge-ok' : score >= 70 ? 'badge-warn' : 'badge-ng';
      const modelText = model ? ` <small style="color:var(--text-muted)">(${esc(model)})</small>` : '';
      return `<tr><td>${label}</td><td><span class="badge ${cls}">${score}点</span> ${esc(status || '')}${modelText}</td></tr>`;
    };
    const ollamaRow = r.ollama_enabled ? scoreBadge('Ollama', r.ollama_score, r.ollama_status, r.ollama_model, r.ollama_error) : '';
    const chatgptRow = r.chatgpt_enabled ? scoreBadge('ChatGPT', r.chatgpt_score, r.chatgpt_status, r.chatgpt_model, r.chatgpt_error) : '';
    return `<div class="card">
      <h3>${esc(r.title)}</h3>
      <table class="status-table">
        <tr><td>形式</td><td>${esc(r.video_format)} / セリフ数: ${r.dialogue_count}</td></tr>
        <tr><td>推定尺</td><td>${durationText}</td></tr>
        ${ollamaRow}
        ${chatgptRow}
      </table>
    </div>`;
  }).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function appendCheckLog(msg, tag) {
  const logBox = document.getElementById('check-log');
  const t = new Date().toTimeString().slice(0, 8);
  logBox.insertAdjacentHTML('beforeend', buildLogLine(msg, tag, t));
  logBox.scrollTop = logBox.scrollHeight;
}
</script>
{% endblock %}
