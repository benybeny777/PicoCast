{% extends "base.html" %}

{% block title %}ComfyUIモデル管理{% endblock %}

{% block content %}
<div class="content-header">
  <h2>ComfyUIモデル管理</h2>
  <div class="header-actions">
    <button type="button" class="btn btn-secondary" onclick="loadModels()">再スキャン</button>
    <button type="button" class="btn btn-primary" id="btn-install-all" onclick="installAll()">自動導入可能分をインストール</button>
  </div>
</div>

<div class="card">
  <h3>導入状況</h3>
  <p class="hint" style="margin-bottom: 1rem;">
    Local ComfyUI を使用する場合に必要なモデルの一覧です。手動ダウンロード必須のモデルはご自身で配置してください。
  </p>
  <div id="models-container"><p>読み込み中...</p></div>
</div>

<style>
.progress-wrap { background: var(--border); border-radius: 4px; height: 10px; overflow: hidden; margin: 4px 0; }
.progress-bar  { height: 10px; background: var(--accent2); transition: width 0.3s ease; }
.progress-text { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
</style>
{% endblock %}

{% block scripts %}
<script>
let _models = [];
let _pollTimer = null;

/* model name → safe DOM id */
function safeId(name) { return 'model-' + name.replace(/[^a-zA-Z0-9]/g, '_'); }

function fmtBytes(b) {
  if (!b) return '0 B';
  const u = ['B','KB','MB','GB'];
  let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return b.toFixed(i > 1 ? 1 : 0) + ' ' + u[i];
}

async function loadModels(progress = {}) {
  const container = document.getElementById('models-container');
  container.innerHTML = '<p>スキャン中...</p>';
  try {
    const res = await fetch('/api/comfyui/models');
    const data = await res.json();
    if (data.status === 'ok') {
      _models = data.models;
      renderTable(_models, progress);
    } else {
      container.innerHTML = `<p class="error-text">エラー: ${esc(data.message)}</p>`;
    }
  } catch (e) {
    container.innerHTML = `<p class="error-text">通信エラーが発生しました。</p>`;
  }
}

function renderTable(models, progress) {
  const container = document.getElementById('models-container');
  if (models.length === 0) {
    container.innerHTML = '<p>必要なモデルは定義されていません。</p>';
    return;
  }

  let html = '<table class="status-table" style="width:100%">';
  html += '<thead><tr><th style="width:7em">状態</th><th>モデル名</th><th>配置先</th><th style="width:18em">アクション</th></tr></thead><tbody>';

  for (const m of models) {
    const sid = safeId(m.name);
    const prog = progress[m.name];
    const isDownloading = prog && prog.status === 'downloading';
    const isVerifying  = prog && prog.status === 'verifying';
    const isDone       = prog && prog.status === 'done';
    const isError      = prog && prog.status === 'error';
    const effective    = isDone ? 'installed' : m.status;

    html += `<tr id="${sid}">`;

    // 状態列
    if (effective === 'installed') {
      html += '<td><span class="badge badge-ok">導入済み</span></td>';
    } else if (isDownloading) {
      html += '<td><span class="badge badge-warn">DL中</span></td>';
    } else if (isVerifying) {
      html += '<td><span class="badge badge-warn">検証中</span></td>';
    } else if (isError) {
      html += '<td><span class="badge badge-ng">エラー</span></td>';
    } else {
      html += '<td><span class="badge badge-ng">未導入</span></td>';
    }

    // 名前・種別
    html += `<td><strong>${esc(m.name)}</strong><br><small style="color:var(--text-dim)">${esc(m.type)}</small></td>`;

    // 配置先
    html += `<td style="font-family:monospace;font-size:0.9em">${esc(m.target_dir)}</td>`;

    // アクション列
    html += '<td>';
    if (isDownloading) {
      const pct = prog.percent || 0;
      const dlText = prog.total
        ? `${fmtBytes(prog.downloaded)} / ${fmtBytes(prog.total)} (${pct}%)`
        : `${fmtBytes(prog.downloaded)} ダウンロード中...`;
      html += `<div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>`;
      html += `<div class="progress-text">${esc(dlText)}</div>`;
    } else if (isVerifying) {
      html += `<div class="progress-wrap"><div class="progress-bar" style="width:100%;background:var(--warn)"></div></div>`;
      html += `<div class="progress-text">SHA256 検証中...</div>`;
    } else if (isError) {
      html += `<span style="color:var(--err);font-size:12px">${esc(prog.message || 'エラー')}</span><br>`;
      if (!m.manual_download) {
        html += `<button class="btn btn-secondary" style="margin-top:4px;font-size:12px" onclick="installModel('${esc(m.name)}')">再試行</button>`;
      }
    } else if (effective === 'installed') {
      html += '<span style="color:var(--text-dim)">OK</span>';
    } else if (m.manual_download) {
      html += `<a href="${esc(m.download_url)}" target="_blank" class="btn btn-secondary" style="font-size:12px">手動DL先へ</a><br>`;
      html += `<small style="color:var(--text-dim)">ライセンス: ${esc(m.license_note)}</small>`;
    } else {
      html += `<button class="btn btn-primary" style="font-size:12px" onclick="installModel('${esc(m.name)}')">DLして配置</button>`;
    }
    html += '</td></tr>';
  }
  html += '</tbody></table>';
  container.innerHTML = html;
}

async function pollProgress() {
  try {
    const res = await fetch('/api/comfyui/models/progress');
    const data = await res.json();
    const progress = data.progress || {};
    const allRunning = data.install_all_running;

    renderTable(_models, progress);

    const anyActive = allRunning || Object.values(progress).some(
      p => p.status === 'downloading' || p.status === 'verifying'
    );
    if (!anyActive) {
      stopPolling();
      // 完了・エラー状態を保ったままモデル一覧を再スキャン
      await loadModels(progress);
    }
  } catch (e) {
    // 通信エラーはスキップしてポーリング継続
    console.warn('progress poll error:', e);
  }
}

function startPolling() {
  if (_pollTimer) return;
  _pollTimer = setInterval(pollProgress, 500);
}

function stopPolling() {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
}

async function installModel(name) {
  try {
    const res = await fetch('/api/comfyui/models/install', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    const data = await res.json();
    if (data.status === 'started') {
      startPolling();
    } else {
      alert('エラー: ' + data.message);
    }
  } catch (e) {
    alert('通信エラーが発生しました。');
  }
}

async function installAll() {
  if (!confirm('自動ダウンロード可能なすべての不足モデルを一括ダウンロードしますか？時間がかかる場合があります。')) return;
  const btn = document.getElementById('btn-install-all');
  btn.disabled = true;
  try {
    const res = await fetch('/api/comfyui/models/install_all', { method: 'POST' });
    const data = await res.json();
    if (data.status === 'started') {
      startPolling();
    } else {
      alert('エラー: ' + data.message);
      btn.disabled = false;
    }
  } catch (e) {
    alert('通信エラーが発生しました。');
    btn.disabled = false;
  }
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('DOMContentLoaded', loadModels);
</script>
{% endblock %}
